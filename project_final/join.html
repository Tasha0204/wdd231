<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - Horizonte Coffee Shop</title>
    <meta name="description" content="Book your table or workspace at Horizonte Coffee Shop. Fill out our secure form.">
    <meta name="author" content="Tasha Vidal">
    
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <meta property="og:title" content="Book your Table or Coworking Space - Horizonte Coffee Shop">
    <meta property="og:description" content="Reserve your spot with priority. Enjoy the best coffee and high-speed connection in Lima.">
    <meta property="og:image" content="https://tasha0204.github.io/wdd231/project_final/images/logocafe.png">
    <meta property="og:url" content="https://tasha0204.github.io/wdd231/project_final/join.html">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/join.css">
    <link rel="stylesheet" href="styles/large.css">
    <script defer src="scripts/join.js"></script>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="images/logocafe.webp" alt="Horizonte Coffee Shop Logo" width="80" height="80">
            <p class="header-title">Horizonte Coffee Shop</p>
        </div>
        <nav>
            <button id="menu-toggle" aria-label="Open navigation menu">☰</button>
            <ul id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="menu.html">Product</a></li>
                <li><a href="join.html" class="active">Booking</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h1>Book Your Experience</h1>
            <p>Fill in your details to reserve a table or a coworking space with us.</p>
            
            <form method="get" action="thankyou.html" class="booking-form">
                <label>
                    <span>Full Name *</span>
                    <input type="text" name="name" required placeholder="e.g., Tasha Vidal">
                </label>

                <label>
                    <span>Email Address *</span>
                    <input type="email" name="email" required placeholder="example@email.com">
                </label>

                <label>
                    <span>Mobile Phone *</span>
                    <input type="tel" name="phone" required placeholder="987654321">
                </label>

                <label>
                    <span>Booking Type *</span>
                    <select name="booking_type" required>
                        <option value="" disabled selected>Select an option...</option>
                        <option value="Standard Table">Standard Table (Coffee Shop)</option>
                        <option value="Coworking Space">Coworking Space (High-speed connection)</option>
                        <option value="Private Event">Lounge Area (Meetings)</option>
                    </select>
                </label>

                <label>
                    <span>Date and Time *</span>
                    <input type="datetime-local" name="date_time" required>
                </label>

                <label>
                    <span>Special Notes / Allergies</span>
                    <textarea name="notes" rows="4" placeholder="Tell us if you are celebrating something special or have any dietary requirements..."></textarea>
                </label>

                <input type="hidden" id="timestamp" name="timestamp" value="">

                <button type="submit" class="submit-btn">Confirm Reservation</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-info">
                <p>Horizonte Coffee Shop</p>
                <p>contacto@horizonte.com</p>
                <p>Lima, Peru</p>
            </div>
            
            <div class="social-icons">
                <a href="https://www.facebook.com/" target="_blank"><img src="images/facebook.png" alt="Facebook" width="30" height="30"></a>
                <a href="https://www.youtube.com/" target="_blank"><img src="images/youtube.png" alt="Youtube" width="30" height="30"></a>
                <a href="https://www.linkedin.com/" target="_blank"><img src="images/linkedin.png" alt="Linkedin" width="30" height="30"></a>
            </div>
            
            <div class="footer-copy">
                <p>&copy;<span id="currentyear"></span> | tashavidal | WDD 231 Project</p>
                <p>Lima, Peru</p>
                <p>Last Update: <span id="lastModified"></span></p>
            </div>
        </div>
    </footer>

</body>
</html>
