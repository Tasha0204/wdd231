<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - Cafetería Horizonte</title>
    <meta name="description" content="Reserva tu mesa o un espacio de trabajo en Cafetería Horizonte. Completa nuestro formulario seguro.">
    <meta name="author" content="Tasha Vidal">
    
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/join.css">
    <link rel="stylesheet" href="styles/large.css">
    <script defer src="scripts/join.js"></script>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="images/logomarca.png" alt="Cafetería Horizonte Logo" width="80" height="80">
            <p class="header-title">Cafetería Horizonte</p>
        </div>
        <nav>
            <button id="menu-toggle" aria-label="Open navigation menu">☰</button>
            <ul id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="menu.html">Product</a></li>
                <li><a href="join.html" class="active">Booking</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h1>Reserva tu Experiencia</h1>
            <p>Completa tus datos para separar una mesa o un espacio de coworking con nosotros.</p>
            
            <form method="get" action="thankyou.html" class="booking-form">
                <label>
                    <span>Nombre Completo *</span>
                    <input type="text" name="name" required placeholder="Ej. Tasha Vidal">
                </label>

                <label>
                    <span>Correo Electrónico *</span>
                    <input type="email" name="email" required placeholder="ejemplo@correo.com">
                </label>

                <label>
                    <span>Teléfono celular *</span>
                    <input type="tel" name="phone" required placeholder="987654321">
                </label>

                <label>
                    <span>Tipo de Reserva *</span>
                    <select name="booking_type" required>
                        <option value="" disabled selected>Selecciona una opción...</option>
                        <option value="Mesa Estándar">Mesa Estándar (Cafetería)</option>
                        <option value="Espacio Coworking">Espacio Coworking (Conexión de alta velocidad)</option>
                        <option value="Evento Privado">Zona Lounge (Reuniones)</option>
                    </select>
                </label>

                <label>
                    <span>Fecha y Hora *</span>
                    <input type="datetime-local" name="date_time" required>
                </label>

                <label>
                    <span>Notas especiales / Alergias</span>
                    <textarea name="notes" rows="4" placeholder="Cuéntanos si celebras algo especial o tienes requerimientos de dieta..."></textarea>
                </label>

                <input type="hidden" id="timestamp" name="timestamp" value="">

                <button type="submit" class="submit-btn">Confirmar Reserva</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-info">
                <p>Cafetería Horizonte</p>
                <p>contacto@horizonte.com</p>
                <p>Lima, Perú</p>
            </div>
            
            <div class="social-icons">
                <a href="https://www.facebook.com/" target="_blank"><img src="images/facebook.png" alt="Facebook" width="30" height="30"></a>
                <a href="https://www.youtube.com/" target="_blank"><img src="images/youtube.png" alt="Youtube" width="30" height="30"></a>
                <a href="https://www.linkedin.com/" target="_blank"><img src="images/linkedin.png" alt="Linkedin" width="30" height="30"></a>
            </div>
            
            <div class="footer-copy">
                <p>&copy;<span id="currentyear"></span> | tashavidal | WDD 231 Project</p>
                <p>Lima, Perú</p>
                <p>Last Update: <span id="lastModified"></span></p>
            </div>
        </div>
    </footer>

</body>
</html>
