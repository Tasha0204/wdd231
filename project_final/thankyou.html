<!DOCTYPE html>
<html lang="en">
<head>

    <title>Reserva Confirmada - Cafetería Horizonte</title>

    <link rel="stylesheet" href="styles/join.css">

    <footer>
        <p>&copy; Cafetería Horizonte | WDD 231 Project</p>
