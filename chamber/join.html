<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us | PERU Chamber of Commerce</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <meta name="description" content="Join the official Peru Chamber of Commerce and grow your business.">
    <meta name="author" content="Tasha Vidal">
    
    <link rel="stylesheet" href="styles/basejoin.css">
    <link rel="stylesheet" href="styles/largeindex.css">
    <script src="scripts/join.js" type="module"></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="images/logomarca.png" alt="Chamber of Commerce Logo" width="80" height="80">
            <p class="header-title">PERU Chamber of Commerce</p>
        </div>
        <nav>
            <ul id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="directory.html">Directory</a></li>
                <li><a href="join.html" class="active">Join</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="join-main">
        <h1>Peru Chamber of Commerce</h1>
        <h2>Membership Application Form</h2>
        <form action="thankyou.html" method="get">
            <input type="hidden" id="timestamp" name="timestamp">
            
            <div class="form-group">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" required autocomplete="given-name" title="Enter your first name">
            </div>
            <div class="form-group">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname" required autocomplete="family-name" title="Enter your last name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="example@email.com" autocomplete="email" title="Enter your email address">
            </div>
            <div class="form-group">
                <label for="phone">Mobile Phone</label>
                <input type="tel" id="phone" name="phone" required autocomplete="tel" title="Enter your phone number">
            </div>
            <div class="form-group">
                <label for="org">Organization Name</label>
                <input type="text" id="org" name="org" required autocomplete="organization" title="Enter your organization name">
            </div>
            <div class="form-group">
                <label for="org-title">Organization Title</label>
                <input type="text" id="org-title" name="org-title" autocomplete="organization-title" 
                       title="Enter your job title (at least 7 characters)" pattern="[A-Za-z\s\-]{7,}">
            </div>
            <div class="form-group">
                <label for="description">Organization Description</label>
                <textarea id="description" name="description" title="Describe your organization"></textarea>
            </div>
            <div class="form-group">
                <label for="membership">Membership Level</label>
                <select id="membership" name="membership" required title="Select a membership level">
                    <option value="" disabled selected>Select a level</option>
                    <option value="np">Non-Profit</option>
                    <option value="bronze">Bronze</option>
                    <option value="silver">Silver</option>
                    <option value="gold">Gold</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">Submit Application</button>
        </form>

        <div class="membership-grid">
            <div class="membership-card" data-modal="modal-np">Non-Profit Level</div>
            <div class="membership-card" data-modal="modal-bronze">Bronze Level</div>
            <div class="membership-card" data-modal="modal-silver">Silver Level</div>
            <div class="membership-card" data-modal="modal-gold">Gold Level</div>
        </div>
    </main>

    <div id="modal-np" class="modal"><div class="modal-content"><h3>Non-Profit</h3><p>...</p><button class="close-btn">Close</button></div></div>
    <div id="modal-bronze" class="modal"><div class="modal-content"><h3>Bronze</h3><p>...</p><button class="close-btn">Close</button></div></div>
    <div id="modal-silver" class="modal"><div class="modal-content"><h3>Silver</h3><p>...</p><button class="close-btn">Close</button></div></div>
    <div id="modal-gold" class="modal"><div class="modal-content"><h3>Gold</h3><p>...</p><button class="close-btn">Close</button></div></div>

    <footer>
        <p>&copy; 2026 PERU Chamber of Commerce | Tasha Vidal</p>
    </footer>
</body>
</html>
