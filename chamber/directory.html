<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Directory | PERU Chamber of Commerce</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Montserrat+Alternates:wght@100;400;700&display=swap" rel="stylesheet">
    
    <meta name="description" content="Explore the official Peru Chamber of Commerce business directory.">
    <meta name="author" content="Tasha Vidal">
    
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/largeindex.css">
    <link rel="stylesheet" href="styles/directory.css">

    <script src="scripts/directory.js" type="module"></script>
</head>

<body>
    <header>
        <div class="nav-links-wrapper">
            <div class="logo-box">
                <a href="index.html">
                    <img id="icc" src="images/logomarca.png" alt="Peru Chamber of Commerce" width="50" height="50">
                </a>
                <h1>PERU Chamber of Commerce</h1>
            </div>

            <nav>
                <button id="menu" aria-label="menu">☰</button>
                <ul id="nav-menu">
                    <li><a href="index.html" >Home</a></li>
                    <li><a href="directory.html"class="active">Directory</a></li>
                    <li><a href="join.html">Join</a></li>
                    <li><a href="discover.html">Discover</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="hero-container">
        <div class="hero">
            <picture>
                <source media="(max-width: 680px)" srcset="images/hero.jpg">
                <img src="images/lima.webp" width="1600" height="350" alt="Panoramic view of the city of Lima">
            </picture>
        </div>
    </div>

    <main>
        <div class="container">
            <h1>Business Directory</h1>
            <hr>
            
            <h2>Find a chamber member</h2>
            <label for="dynamic-businesses">Select a category:</label>
            <select name="dynamic-businesses" id="dynamic-businesses">
                <option value="" id="select">Select</option>
            </select>

            <div class="layout">
                <button id="grid"><img src="images/grid.png" alt="grid layout" width="30" height="30"></button>
                <button id="list"><img src="images/list.png" alt="list layout" width="20" height="20"></button>
            </div>

            <div id="businesses"></div>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-info">
                <p>PERU Chamber of Commerce</p>
                <p>peru@gmail.com.ph</p>
                <p>PERU, LIMA City</p>
            </div>
            
            <div class="social-icons">
                <a href="https://www.facebook.com/" target="_blank"><img src="images/facebook.png" alt="Facebook" width="30" height="30"></a>
                <a href="https://www.youtube.com/" target="_blank"><img src="images/youtube.png" alt="Youtube" width="30" height="30"></a>
                <a href="https://www.linkedin.com/" target="_blank"><img src="images/linkedin.png" alt="Linkedin" width="30" height="30"></a>
            </div>
            
            <div class="footer-copy">
                 <p>&copy;<span id="currentyear"></span> | tashavidal | WDD 231 Project</p>
                <p>Lima, Peru</p>
                <p>Last Update: <span id="lastModified"></span></p>
            </div>
        </div>
    </footer>
</body>
</html>
